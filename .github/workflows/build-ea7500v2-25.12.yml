name: "Build QModem for Linksys EA7500 v2 (25.12)"

on:
  workflow_dispatch:

env:
  TZ: Asia/Jakarta
  SDK_NAME: openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64
  SDK_EXT: tar.zst
  SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7621/
  SDK_ARCH: mipsel_24kc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Initialization environment
        run: |
          set -e
          file_name="${SDK_NAME}.${SDK_EXT}"
          wget -q "${SDK_URL}${file_name}"
          mkdir -p sdk
          tar --zstd -xvf "$file_name" -C ./sdk --strip-components=1
          rm -f "$file_name"

          cd sdk

          # Sama pola main.yml, tapi branch 25.12 biar cocok release
          echo "src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12" > feeds.conf
          echo "src-git packages https://github.com/openwrt/packages.git;openwrt-25.12" >> feeds.conf
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-25.12" >> feeds.conf
          echo "src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12" >> feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cd ..
          echo "src-link qmodem $(pwd)/qmodem" >> sdk/feeds.conf
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          cat ../qmodem/.github/workflows/openwrt_package.config >> .config

          make defconfig
          make download -j$(nproc) || true

      - name: Compile QModem
        id: compile
        run: |
          set -e
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          # Nama package yang BENAR (dari Makefile)
          # Urutan: dependency dulu
          for package in \
            tom_modem \
            ubus-at-daemon \
            sms-tool_q \
            modem_scan \
            quectel-CM-5G-M \
            qmodem \
            luci-app-qmodem \
            luci-app-qmodem-next \
            luci-app-qmodem-sms
          do
            echo "===== Compiling $package ====="
            # Tetap lanjut kalau 1 package gagal, tapi log jelas
            make package/$package/compile -j$(nproc) V=s || echo "FAILED: $package"
          done

          echo "===== Hasil di bin/packages ====="
          find bin/packages -type d -name "qmodem" -o -type d -name "base" | head -20
          find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \) | head -50

          # Path resmi main.yml
          if [ -d "bin/packages/${SDK_ARCH}/qmodem" ]; then
            echo "FIRMWARE=$(pwd)/bin/packages/${SDK_ARCH}/qmodem/" >> "$GITHUB_ENV"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            # fallback: kumpulkan semua package QModem di mana pun
            mkdir -p /tmp/qmodem-out
            find bin/packages -type f \( -name "*qmodem*" -o -name "*tom_modem*" -o -name "*ubus-at-daemon*" -o -name "*quectel*" -o -name "*sms-tool*" -o -name "*modem_scan*" \) \
              \( -name "*.ipk" -o -name "*.apk" \) -exec cp -v {} /tmp/qmodem-out/ \;
            count=$(find /tmp/qmodem-out -type f | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "FIRMWARE=/tmp/qmodem-out/" >> "$GITHUB_ENV"
              echo "status=success" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "Tidak ada artifact. Cek log FAILED di atas."
              exit 1
            fi
          fi

      - name: Upload QModem
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: QModem-Linksys-EA7500v2-25.12
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 14
