name: "Build QModem for Linksys EA7500 v2 (25.12)"

on:
  workflow_dispatch:

env:
  TZ: Asia/Jakarta
  SDK_NAME: openwrt-sdk-25.12.0-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64
  SDK_EXT: tar.zst
  SDK_URL: https://downloads.openwrt.org/releases/25.12.0/targets/ramips/mt7621/
  SDK_ARCH: mipsel_24kc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'qmodem'

      - name: Download & prepare OpenWrt 25.12 SDK
        run: |
          file_name="${SDK_NAME}.${SDK_EXT}"
          wget -q "${SDK_URL}${file_name}"
          mkdir sdk
          tar --zstd -xvf "$file_name" -C ./sdk --strip-components=1
          rm -f "$file_name"

          cd sdk
          # Setup official feeds
          echo "src-git base https://github.com/openwrt/openwrt.git;openwrt-25.12" > feeds.conf
          echo "src-git packages https://github.com/openwrt/packages.git;openwrt-25.12" >> feeds.conf
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-25.12" >> feeds.conf
          echo "src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12" >> feeds.conf

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Link seluruh repo QModem sebagai feed (ini yang paling penting!)
          echo "src-link qmodem $(pwd)/../qmodem" >> feeds.conf
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          # Config dasar
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          # Ambil config package dari repo
          cat ../qmodem/.github/workflows/openwrt_package.config >> .config

          make defconfig
          make download -j$(nproc) || true

      - name: Compile QModem packages
        run: |
          cd sdk
          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

          generic_package=$(cat ../qmodem/.github/workflows/qmodem_package_generic)
          arch_package=$(cat ../qmodem/.github/workflows/qmodem_package_arch)

          for package in $generic_package; do
            echo "=== Compiling $package ==="
            make package/$package/compile -j$(nproc) V=s || true
          done

          for package in $arch_package; do
            echo "=== Compiling $package ==="
            make package/$package/compile -j$(nproc) V=s || true
          done

          echo "=== Hasil package ==="
          ls -la bin/packages/${SDK_ARCH}/qmodem/ || ls -la bin/packages/*/qmodem/ || true

      - name: Organize Artifacts
        run: |
          mkdir -p output
          # Cari semua .ipk / .apk hasil build
          find sdk/bin/packages -type f \( -name ".ipk" -o -name ".apk" \) -exec cp -v {} output/ \;
          ls -la output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QModem-Linksys-EA7500v2-25.12
          path: output/
          retention-days: 14
